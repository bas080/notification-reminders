name: Test, Build & Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'SemVer tag for release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Update App Version & Create Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          RAW_INPUT="${{ inputs.tag_name }}"
          if [[ "$RAW_INPUT" =~ ^v ]]; then
            TAG_NAME="$RAW_INPUT"
            VERSION_NAME="${RAW_INPUT#v}"
          else
            TAG_NAME="v${RAW_INPUT}"
            VERSION_NAME="$RAW_INPUT"
          fi

          echo "Updating versionName in app/build.gradle.kts to ${VERSION_NAME}"
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          CURRENT_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          echo "Incrementing versionCode from ${CURRENT_VERSION_CODE} to ${NEW_VERSION_CODE}"
          sed -i "s/versionCode = [0-9]*/versionCode = ${NEW_VERSION_CODE}/" app/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -am "Update app version to ${VERSION_NAME}" || true
          git tag -f "${TAG_NAME}"
          git push origin HEAD:master --tags || git push origin "${TAG_NAME}" || true

      - name: Run Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew test
          else
            gradle test
          fi

      - name: Build Application (Signed Release & Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assemble
          else
            gradle assemble
          fi

      - name: Determine Release Details
        id: build_info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            RELEASE_NAME="${PR_TITLE} (#${PR_NUMBER})"
            TAG_NAME="pr-${PR_NUMBER}-${GITHUB_SHA::7}"
            PRERELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_INPUT="${{ inputs.tag_name }}"
            if [[ "$RAW_INPUT" =~ ^v ]]; then
              TAG_NAME="$RAW_INPUT"
            else
              TAG_NAME="v${RAW_INPUT}"
            fi
            RELEASE_NAME="${TAG_NAME}"
            PRERELEASE="false"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_NAME="${GITHUB_REF#refs/tags/}"
            TAG_NAME="${RELEASE_NAME}"
            PRERELEASE="false"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
            SHORT_HASH=$(git rev-parse --short HEAD)
            RELEASE_NAME="${COMMIT_TITLE} (${SHORT_HASH})"
            TAG_NAME="master-${SHORT_HASH}"
            PRERELEASE="true"
          else
            RELEASE_NAME="Build-${GITHUB_SHA::7}"
            TAG_NAME="build-${GITHUB_SHA::7}"
            PRERELEASE="true"
          fi
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "PRERELEASE=${PRERELEASE}" >> $GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG_NAME }}
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
