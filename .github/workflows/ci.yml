name: Test, Build & Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable (if present)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Run Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew test
          else
            gradle test
          fi

      - name: Build Application
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assemble
          else
            gradle assemble
          fi

      - name: Determine Release / Build Name
        id: build_name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            NAME="${PR_TITLE} (#${PR_NUMBER})"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
            SHORT_HASH=$(git rev-parse --short HEAD)
            NAME="${COMMIT_TITLE} (${SHORT_HASH})"
          else
            NAME="Build-${GITHUB_SHA::7}"
          fi
          echo "RELEASE_NAME=${NAME}" >> $GITHUB_ENV
          echo "Release/Build Name: ${NAME}"

      - name: Create Release / Artifact Summary
        run: |
          echo "Build & Test Completed Successfully"
          echo "Release Name: ${{ env.RELEASE_NAME }}"
